name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            https://ai-derm-assistant-api.onrender.com/health || echo "Ping failed (service may be waking up)"
