# Vercel config only. Dependencies live in requirements.txt (runtime) and
# requirements-dev.txt (tests); Python version in .python-version.

[tool.vercel]
# FastAPI app instance for the Vercel Python runtime.
entrypoint = "src.api.main:app"

[tool.vercel.scripts]
# Fail the build if Git LFS model files arrived as pointer files.
build = "python scripts/check_models.py"
