services:
  - type: web
    name: ai-derm-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    region: oregon
    # Model files are Git LFS objects: fail the build loudly if only pointer files arrived.
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "import pathlib,sys; bad=[p.name for p in pathlib.Path('checkpoints/v3').glob('*.onnx') if p.stat().st_size < 1_000_000]; sys.exit('LFS pointer files: %s' % bad if bad else 0)"
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
